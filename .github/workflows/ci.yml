name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ORT_VERSION: "1.31.0"   # keep in step with requirements-serve.txt

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v5   # Spark tests need a JVM
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -e ".[etl,dev]" -r requirements-serve.txt
      - run: pytest -q -rs

  pipeline:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[etl,train,index,dev]" -r requirements-serve.txt
      - run: bash scripts/smoke.sh
      - name: Summary
        run: |
          {
            echo '### ETL';        echo '```json'; cat data/processed/etl_report.json; echo '```'
            echo '### LoRA';       echo '```json'; cat artifacts/metrics_lora.json; echo '```'
            echo '### Head only';  echo '```json'; cat artifacts/metrics_head.json; echo '```'
            echo '### Calibration';echo '```json'; cat artifacts/calibration.json; echo '```'
            echo '### ONNX';       echo '```json'; cat artifacts/onnx_report.json; echo '```'
            echo '### Index';      echo '```json'; cat artifacts/index/info.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline
          path: |
            artifacts/onnx
            artifacts/index
            artifacts/plots
            artifacts/*.json

  cpp:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: pipeline, path: artifacts}
      - name: Fetch ONNX Runtime
        run: |
          curl -sSL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz -C cpp
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_ROOT="$PWD/cpp/onnxruntime-linux-x64-${ORT_VERSION}"
      - run: cmake --build cpp/build -j
      - name: Run and check parity against PyTorch logits
        run: |
          ./cpp/build/reviewscope_infer artifacts/onnx/classifier.onnx artifacts/onnx/tokens.bin artifacts/onnx/expected.bin 5 2 | tee cpp.json
          { echo '### C++ runner'; echo '```json'; cat cpp.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  k8s:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: pipeline, path: artifacts}
      - run: docker build -t reviewscope:dev .
      - name: Image has no torch
        run: "! docker run --rm reviewscope:dev python -c 'import torch'"
      - uses: helm/kind-action@v1
        with: {cluster_name: reviewscope}
      - run: kind load docker-image reviewscope:dev --name reviewscope
      - run: kubectl apply -k k8s/
      - run: kubectl -n reviewscope rollout status deploy/reviewscope-api --timeout=180s
      - name: Smoke the service
        run: |
          kubectl -n reviewscope port-forward svc/reviewscope-api 8080:80 &
          sleep 3
          curl -sf localhost:8080/healthz
          curl -sf -X POST localhost:8080/classify -H 'content-type: application/json' \
            -d '{"texts":["Servers are rock solid, combat feels amazing.","Crashes on alt-tab, way overpriced."]}'
          curl -sf "localhost:8080/search?q=cheaters%20in%20multiplayer&k=3"
      - if: failure()
        run: kubectl -n reviewscope describe pods; kubectl -n reviewscope logs -l app=reviewscope-api --tail=100
