apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewscope-api
  labels: {app: reviewscope-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: reviewscope-api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: reviewscope-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: reviewscope
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REVIEWSCOPE_INT8   # int8 matched fp32 accuracy in the export report
              value: "1"
            - name: OMP_NUM_THREADS
              value: "2"
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 1536Mi}
          # /healthz loads the models and the index, so "ready" means ready to answer.
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
